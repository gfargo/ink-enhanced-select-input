name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: 20
            ink: '6'
          - node-version: 22
            ink: '6'
          - node-version: 22
            ink: '7'
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        if: matrix.ink == '6'
        run: yarn lint

      - name: Install Ink 7
        if: matrix.ink == '7'
        run: yarn add --dev ink@^7.1.1 react@^19.2.0

      - name: Test
        run: yarn test
